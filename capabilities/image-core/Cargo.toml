[package]
name = "image-core"
version = "1.0.0"
description = "ToolBox image processing capability (wasm)"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# 只启用需要的编解码器，控制 wasm 体积（不含 rav1e/AV1 等重型编码器）。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[profile.release]
opt-level = "s"
lto = true
