[package]
name = "toolbox"
version = "0.2.2"
description = "ToolBox - a modular desktop toolbox"
authors = ["ToolBox"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
sha2 = "0.10"
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
# 网络原语（commands/net.rs）：入站 WS/HTTP + UDP，全部薄封装转发
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink", "async-await"] }
if-addrs = "0.13"
socket2 = "0.5"
base64 = "0.22"

[features]
# Used for production builds where the frontend is bundled.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
